<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Viewer — TradeView Pro</title>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0e17; color:#d1d4dc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* ── Nav bar ── */
  .nav-bar { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; background:#131722; border-bottom:1px solid #2a2e3e; flex-shrink:0; }
  .nav-links { display:flex; gap:6px; }
  .nav-link { color:#787b86; text-decoration:none; font-size:13px; padding:6px 12px; border-radius:4px; transition:all 0.15s; }
  .nav-link:hover { color:#d1d4dc; background:#1e222d; }
  .nav-link.active { color:#d1d4dc; background:#2962ff; }
  .nav-title { font-size:15px; font-weight:600; color:#d1d4dc; }

  /* ── Main layout ── */
  .main { display:flex; flex:1; overflow:hidden; }

  /* ── Left panel ── */
  .left-panel { width:320px; min-width:280px; border-right:1px solid #2a2e3e; display:flex; flex-direction:column; background:#0f1319; }
  .filter-bar { padding:8px; border-bottom:1px solid #2a2e3e; display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .filter-row { display:flex; gap:4px; flex-wrap:wrap; }
  .filter-btn { padding:4px 8px; font-size:11px; border-radius:3px; border:1px solid #2a2e3e; background:none; color:#787b86; cursor:pointer; font-family:inherit; transition:all 0.15s; }
  .filter-btn:hover { color:#d1d4dc; border-color:#363a45; }
  .filter-btn.active { background:#2a2e3e; color:#d1d4dc; border-color:#363a45; }
  .search-input { width:100%; padding:6px 10px; font-size:12px; border-radius:4px; border:1px solid #2a2e3e; background:#131722; color:#d1d4dc; font-family:inherit; outline:none; }
  .search-input:focus { border-color:#2962ff; }
  .search-input::placeholder { color:#787b86; }
  .filter-label { font-size:10px; color:#787b86; text-transform:uppercase; letter-spacing:0.5px; padding:2px 0 0; }
  .stock-count { font-size:11px; color:#787b86; padding:4px 10px; border-bottom:1px solid #1e222d; flex-shrink:0; }

  /* ── Stock list ── */
  .stock-list { flex:1; overflow-y:auto; }
  .stock-list::-webkit-scrollbar { width:6px; }
  .stock-list::-webkit-scrollbar-track { background:#0f1319; }
  .stock-list::-webkit-scrollbar-thumb { background:#2a2e3e; border-radius:3px; }
  .stock-item { padding:10px 12px; border-bottom:1px solid #1a1e2a; cursor:pointer; transition:background 0.12s; }
  .stock-item:hover { background:#1a1e2e; }
  .stock-item.active { background:#1e2738; border-left:3px solid #2962ff; }
  .stock-item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; }
  .stock-symbol { font-size:13px; font-weight:600; color:#d1d4dc; }
  .stock-price { font-size:12px; color:#787b86; }
  .stock-item-body { display:flex; justify-content:space-between; align-items:center; }
  .stock-pattern { font-size:11px; color:#787b86; }
  .stock-badges { display:flex; gap:4px; align-items:center; }
  .badge { font-size:10px; padding:2px 6px; border-radius:3px; font-weight:500; }
  .badge-bullish { background:rgba(38,166,154,0.15); color:#26a69a; }
  .badge-bearish { background:rgba(239,83,80,0.15); color:#ef5350; }
  .badge-neutral { background:rgba(255,235,59,0.15); color:#ffeb3b; }
  .badge-conf { background:rgba(41,98,255,0.15); color:#5b8def; }
  .badge-near { background:rgba(255,152,0,0.15); color:#ff9800; }
  .badge-breaking { background:rgba(76,175,80,0.15); color:#4caf50; }
  .badge-tf { background:rgba(156,39,176,0.15); color:#ce93d8; }

  /* ── Right panel ── */
  .right-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }

  /* ── Chart header ── */
  .chart-header { padding:10px 16px; border-bottom:1px solid #2a2e3e; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; background:#131722; }
  .chart-header-left { display:flex; align-items:center; gap:12px; }
  .chart-symbol { font-size:18px; font-weight:700; color:#d1d4dc; }
  .chart-name { font-size:12px; color:#787b86; }
  .chart-price-info { display:flex; gap:8px; align-items:baseline; }
  .chart-price { font-size:16px; font-weight:600; }
  .chart-change { font-size:13px; }
  .chart-change.up { color:#26a69a; }
  .chart-change.down { color:#ef5350; }

  /* ── Pattern tabs ── */
  .pattern-tabs { display:flex; gap:4px; padding:8px 16px; border-bottom:1px solid #2a2e3e; flex-shrink:0; background:#0f1319; flex-wrap:wrap; }
  .pattern-tab { padding:5px 12px; font-size:12px; border-radius:4px; border:1px solid #2a2e3e; background:none; color:#787b86; cursor:pointer; font-family:inherit; transition:all 0.15s; }
  .pattern-tab:hover { color:#d1d4dc; border-color:#363a45; }
  .pattern-tab.active { background:#2962ff; color:#fff; border-color:#2962ff; }

  /* ── Chart container ── */
  .chart-container { flex:1; position:relative; min-height:0; }
  .chart-container .tv-lightweight-charts { width:100%!important; height:100%!important; }
  .chart-loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,14,23,0.85); z-index:10; }
  .chart-loading-text { color:#787b86; font-size:14px; }
  .chart-error { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(10,14,23,0.9); z-index:10; gap:12px; }
  .chart-error-text { color:#ef5350; font-size:14px; }
  .retry-btn { padding:6px 16px; font-size:12px; border-radius:4px; border:1px solid #2a2e3e; background:#1e222d; color:#d1d4dc; cursor:pointer; font-family:inherit; }
  .retry-btn:hover { background:#2a2e3e; }
  .chart-placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .chart-placeholder-text { color:#363a45; font-size:16px; }

  /* ── Info card ── */
  .info-card { padding:12px 16px; border-top:1px solid #2a2e3e; background:#131722; flex-shrink:0; }
  .info-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; }
  .info-item { display:flex; flex-direction:column; gap:2px; }
  .info-label { font-size:10px; color:#787b86; text-transform:uppercase; letter-spacing:0.5px; }
  .info-value { font-size:13px; font-weight:500; color:#d1d4dc; }
  .info-value.bullish { color:#26a69a; }
  .info-value.bearish { color:#ef5350; }

  /* ── Legend ── */
  .chart-legend { position:absolute; top:8px; left:12px; z-index:5; display:flex; gap:12px; font-size:11px; pointer-events:none; }
  .legend-item { display:flex; align-items:center; gap:4px; }
  .legend-dot { width:10px; height:3px; border-radius:1px; }

  /* ── Trendline edit handles ── */
  .anchor-handle {
    position:absolute; width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.8); cursor:grab; z-index:15;
    transform:translate(-50%,-50%); transition:box-shadow 0.15s, transform 0.15s;
    pointer-events:none; opacity:0; display:none;
  }
  .anchor-handle.visible { display:block; opacity:0.85; pointer-events:auto; }
  .anchor-handle:hover {
    transform:translate(-50%,-50%) scale(1.4);
    box-shadow:0 0 10px rgba(255,255,255,0.4); opacity:1;
  }
  .anchor-handle.dragging {
    cursor:grabbing; transform:translate(-50%,-50%) scale(1.5); opacity:1;
    box-shadow:0 0 14px rgba(255,255,255,0.6);
  }
  .anchor-handle.res { background:#ef5350; }
  .anchor-handle.sup { background:#26a69a; }

  /* ── Edit toolbar ── */
  .edit-toolbar { display:flex; gap:6px; align-items:center; margin-left:auto; }
  .edit-btn, .reset-btn {
    padding:4px 10px; font-size:11px; border-radius:4px;
    border:1px solid #2a2e3e; background:none;
    color:#787b86; cursor:pointer; font-family:inherit;
    transition:all 0.15s;
  }
  .edit-btn:hover, .reset-btn:hover { color:#d1d4dc; border-color:#363a45; }
  .edit-btn.active { background:#2962ff; color:#fff; border-color:#2962ff; }
  .reset-btn { display:none; }
  .reset-btn.visible { display:inline-block; }

  /* hidden */
  .hidden { display:none!important; }
</style>

<!-- ═══ MAIN ═══ -->

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// PATTERN ICONS & LABELS
// ═══════════════════════════════════════════════════════════════

const PATTERN_ICONS = {
  ascending_triangle:'📐⬆️', descending_triangle:'📐⬇️', symmetrical_triangle:'📐↔️',
  ascending_channel:'📈⬆️', descending_channel:'📉⬇️', rectangle:'⬜',
  rising_wedge:'🔺⬇️', falling_wedge:'🔻⬆️',
};

const PATTERN_LABELS = {
  ascending_triangle:'Asc Triangle', descending_triangle:'Desc Triangle', symmetrical_triangle:'Sym Triangle',
  ascending_channel:'Asc Channel', descending_channel:'Desc Channel', rectangle:'Rectangle',
  rising_wedge:'Rising Wedge', falling_wedge:'Falling Wedge',
};

const PATTERN_CATEGORIES = {
  ascending_triangle:'triangles', descending_triangle:'triangles', symmetrical_triangle:'triangles',
  ascending_channel:'channels', descending_channel:'channels', rectangle:'channels',
  rising_wedge:'wedges', falling_wedge:'wedges',
};

const TF_PARAMS = {
  hourly: { range:'2y', interval:'60m' },
  daily:  { range:'2y', interval:'1d'  },
  weekly: { range:'5y', interval:'1wk' },
};

const IST_OFFSET = 19800; // +5:30 in seconds

// ═══════════════════════════════════════════════════════════════
// DATA STORE
// ═══════════════════════════════════════════════════════════════

const DataStore = {
  allStocks: [],
  filteredStocks: [],
  selectedIndex: -1,
  filters: { pattern: 'all', timeframe: 'all', breakout: 'all', sort: 'confidence', search: '' },
  candleCache: new Map(),

  async load() {
    try {
      const resp = await fetch('/api/scanner/results');
      const data = await resp.json();
      this.allStocks = (data.results || []).filter(s => s.patterns && s.patterns.length > 0);
      this.applyFilters();
    } catch (e) {
      console.error('Failed to load results:', e);
      this.allStocks = [];
      this.filteredStocks = [];
    }
  },

  applyFilters() {
    let list = this.allStocks;
    const f = this.filters;

    if (f.search) {
      const q = f.search.toLowerCase();
      list = list.filter(s => s.symbol.toLowerCase().includes(q) || (s.name || '').toLowerCase().includes(q));
    }

    if (f.timeframe !== 'all') {
      list = list.filter(s => s.patterns.some(p => p.timeframe === f.timeframe));
    }

    if (f.pattern !== 'all') {
      list = list.filter(s => s.patterns.some(p => PATTERN_CATEGORIES[p.pattern] === f.pattern));
    }

    if (f.breakout !== 'all') {
      if (f.breakout === 'actionable') {
        list = list.filter(s => s.patterns.some(p =>
          p.details && ['near_breakout','breaking_out','inside'].includes(p.details.breakoutStatus)));
      } else {
        list = list.filter(s => s.patterns.some(p =>
          p.details && p.details.breakoutStatus === f.breakout));
      }
    }

    // Sort based on selected sort option
    const sortMode = f.sort || 'confidence';
    list.sort((a, b) => {
      if (sortMode === 'breakout_proximity') {
        // Prioritize: near_breakout > breaking_out > inside > extended > far_extended
        const proximityRank = { near_breakout: 0, breaking_out: 1, inside: 2, extended: 3, far_extended: 4 };
        const aStatus = this._bestBreakoutStatus(a);
        const bStatus = this._bestBreakoutStatus(b);
        const aRank = proximityRank[aStatus] !== undefined ? proximityRank[aStatus] : 5;
        const bRank = proximityRank[bStatus] !== undefined ? proximityRank[bStatus] : 5;
        if (aRank !== bRank) return aRank - bRank;
        // Tie-break by minimum distance from trendlines
        const aDist = this._minTrendlineDist(a);
        const bDist = this._minTrendlineDist(b);
        return aDist - bDist;
      }
      if (sortMode === 'recently_broken') {
        // Prioritize breaking_out with high recency, then near_breakout
        const aScore = this._recentBreakoutScore(a);
        const bScore = this._recentBreakoutScore(b);
        return bScore - aScore;
      }
      // Default: confidence
      const aMax = Math.max(...a.patterns.map(p => p.confidence));
      const bMax = Math.max(...b.patterns.map(p => p.confidence));
      return bMax - aMax;
    });

    this.filteredStocks = list;

    // Clamp selected index
    if (this.selectedIndex >= list.length) this.selectedIndex = list.length - 1;
    if (this.selectedIndex < 0 && list.length > 0) this.selectedIndex = 0;
  },

  getSelectedStock() {
    return this.filteredStocks[this.selectedIndex] || null;
  },

  // Get best pattern for the current stock (respecting timeframe filter)
  getBestPattern(stock) {
    if (!stock) return null;
    let patterns = stock.patterns;
    const f = this.filters;
    if (f.timeframe !== 'all') patterns = patterns.filter(p => p.timeframe === f.timeframe);
    if (f.pattern !== 'all') patterns = patterns.filter(p => PATTERN_CATEGORIES[p.pattern] === f.pattern);
    if (!patterns.length) patterns = stock.patterns;
    return patterns.reduce((best, p) => (!best || p.confidence > best.confidence) ? p : best, null);
  },

  // Helper: best breakout status across all patterns of a stock
  _bestBreakoutStatus(stock) {
    const rank = { near_breakout: 0, breaking_out: 1, inside: 2, extended: 3, far_extended: 4 };
    let best = 'far_extended', bestRank = 5;
    for (const p of stock.patterns) {
      const s = p.details && p.details.breakoutStatus;
      if (s && rank[s] !== undefined && rank[s] < bestRank) { best = s; bestRank = rank[s]; }
    }
    return best;
  },

  // Helper: minimum distance from trendlines (for proximity sorting)
  _minTrendlineDist(stock) {
    let minDist = Infinity;
    for (const p of stock.patterns) {
      if (!p.details) continue;
      const dr = Math.abs(p.details.distFromRes || 100);
      const ds = Math.abs(p.details.distFromSup || 100);
      minDist = Math.min(minDist, dr, ds);
    }
    return minDist;
  },

  // Helper: score for "recently broken" sort — breaking_out with high recency scores highest
  _recentBreakoutScore(stock) {
    let best = 0;
    for (const p of stock.patterns) {
      if (!p.details) continue;
      const status = p.details.breakoutStatus;
      const recency = p.details.recency || 0;
      let score = 0;
      if (status === 'breaking_out') {
        score = 100 + recency * 50 + p.confidence; // breaking out + recent = top
      } else if (status === 'near_breakout') {
        score = 50 + recency * 30 + p.confidence;  // near breakout next
      } else if (status === 'inside' && recency > 0.85) {
        score = 20 + recency * 20 + p.confidence;  // inside but recent touch
      }
      best = Math.max(best, score);
    }
    return best;
  }
};

// ═══════════════════════════════════════════════════════════════
// STOCK LIST (Left panel)
// ═══════════════════════════════════════════════════════════════

const StockList = {
  el: null,

  init() {
    this.el = document.getElementById('stockList');
    this.el.addEventListener('click', (e) => {
      const item = e.target.closest('.stock-item');
      if (!item) return;
      const idx = parseInt(item.dataset.index);
      if (isNaN(idx)) return;
      DataStore.selectedIndex = idx;
      this.highlight();
      ChartPanel.loadStock(DataStore.getSelectedStock());
      App.updateHash();
    });
  },

  render() {
    const stocks = DataStore.filteredStocks;
    document.getElementById('stockCount').textContent =
      stocks.length + ' stock' + (stocks.length !== 1 ? 's' : '') + ' with patterns';

    if (!stocks.length) {
      this.el.innerHTML = '<div style="padding:24px;text-align:center;color:#787b86;">No matching patterns found</div>';
      return;
    }

    let html = '';
    for (let i = 0; i < stocks.length; i++) {
      const s = stocks[i];
      const p = DataStore.getBestPattern(s);
      if (!p) continue;
      const active = i === DataStore.selectedIndex ? ' active' : '';
      const icon = PATTERN_ICONS[p.pattern] || '📊';
      const label = PATTERN_LABELS[p.pattern] || p.pattern;
      const dirClass = p.direction === 'bullish' ? 'badge-bullish' : p.direction === 'bearish' ? 'badge-bearish' : 'badge-neutral';
      const bsClass = (p.details && p.details.breakoutStatus === 'near_breakout') ? 'badge-near'
                    : (p.details && p.details.breakoutStatus === 'breaking_out') ? 'badge-breaking' : '';
      const bsLabel = p.details ? (p.details.breakoutStatus || '').replace(/_/g, ' ') : '';
      const currency = s.market === 'nse' ? '₹' : '$';
      const priceStr = s.price ? currency + Number(s.price).toLocaleString('en-IN', { maximumFractionDigits: 2 }) : '';

      html += '<div class="stock-item' + active + '" data-index="' + i + '">'
        + '<div class="stock-item-header">'
        +   '<span class="stock-symbol">' + s.symbol.replace('.NS','') + '</span>'
        +   '<span class="stock-price">' + priceStr + '</span>'
        + '</div>'
        + '<div class="stock-item-body">'
        +   '<span class="stock-pattern">' + icon + ' ' + label + ' [' + p.timeframe + ']</span>'
        +   '<span class="stock-badges">'
        +     '<span class="badge ' + dirClass + '">' + p.direction + '</span>'
        +     '<span class="badge badge-conf">' + p.confidence + '%</span>'
        +     (bsClass ? '<span class="badge ' + bsClass + '">' + bsLabel + '</span>' : '')
        +   '</span>'
        + '</div>'
        + '</div>';
    }
    this.el.innerHTML = html;
  },

  highlight() {
    const items = this.el.querySelectorAll('.stock-item');
    items.forEach(item => {
      const idx = parseInt(item.dataset.index);
      if (idx === DataStore.selectedIndex) {
        item.classList.add('active');
        item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } else {
        item.classList.remove('active');
      }
    });
  }
};

// ═══════════════════════════════════════════════════════════════
// CHART PANEL (Right panel)
// ═══════════════════════════════════════════════════════════════

const ChartPanel = {
  chart: null,
  candleSeries: null,
  volumeSeries: null,
  resLine: null,
  supLine: null,
  currentStock: null,
  abortCtrl: null,

  init() {
    const container = document.getElementById('chartContainer');
    this.chart = LightweightCharts.createChart(container, {
      layout: { background: { type: 'solid', color: '#0a0e17' }, textColor: '#787b86', fontSize: 11 },
      grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal,
        vertLine: { color: '#363a45', width: 1, style: 3, labelBackgroundColor: '#2a2e3e' },
        horzLine: { color: '#363a45', width: 1, style: 3, labelBackgroundColor: '#2a2e3e' },
      },
      rightPriceScale: { borderColor: '#2a2e3e', scaleMargins: { top: 0.1, bottom: 0.2 } },
      timeScale: { borderColor: '#2a2e3e', timeVisible: true, secondsVisible: false },
      handleScroll: true, handleScale: true,
    });

    this.candleSeries = this.chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',
      borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });

    this.volumeSeries = this.chart.addHistogramSeries({
      priceFormat: { type: 'volume' },
      priceScaleId: 'vol',
    });
    this.chart.priceScale('vol').applyOptions({
      scaleMargins: { top: 0.85, bottom: 0 },
    });

    // Resize handler
    const ro = new ResizeObserver(() => {
      this.chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      if (TrendlineEditor.active) TrendlineEditor.repositionHandles();
    });
    ro.observe(container);

    // Retry button
    document.getElementById('retryBtn').addEventListener('click', () => {
      if (this.currentStock) this.loadStock(this.currentStock);
    });
  },

  async loadStock(stock) {
    if (!stock) return;
    TrendlineEditor.deactivate();
    this.currentStock = stock;

    // Pick the single best pattern (highest confidence)
    const patterns = stock.patterns;
    let bestIdx = 0, bestConf = 0;
    patterns.forEach((p, i) => { if (p.confidence > bestConf) { bestConf = p.confidence; bestIdx = i; } });
    const pattern = patterns[bestIdx];
    if (!pattern) return;

    // Update header
    const currency = stock.market === 'nse' ? '₹' : '$';
    document.getElementById('chartSymbol').textContent = stock.symbol.replace('.NS', '');
    document.getElementById('chartName').textContent = stock.name || '';
    document.getElementById('chartPrice').textContent = stock.price ? currency + Number(stock.price).toLocaleString('en-IN', { maximumFractionDigits: 2 }) : '';
    const chgEl = document.getElementById('chartChange');
    if (stock.dailyChange != null) {
      const sign = stock.dailyChange >= 0 ? '+' : '';
      chgEl.textContent = sign + stock.dailyChange.toFixed(2) + '%';
      chgEl.className = 'chart-change ' + (stock.dailyChange >= 0 ? 'up' : 'down');
    } else {
      chgEl.textContent = '';
    }

    // Show pattern info badge instead of tabs
    const icon = PATTERN_ICONS[pattern.pattern] || '📊';
    const label = PATTERN_LABELS[pattern.pattern] || pattern.pattern;
    const tf = pattern.timeframe ? pattern.timeframe.charAt(0).toUpperCase() + pattern.timeframe.slice(1) : '';
    const dirClass = pattern.direction === 'bullish' ? 'badge-bullish' : pattern.direction === 'bearish' ? 'badge-bearish' : 'badge-neutral';
    document.getElementById('patternTabs').innerHTML =
      '<span class="badge ' + dirClass + '" style="font-size:13px;padding:5px 12px;">' +
      icon + ' ' + tf + ': ' + label + ' (' + pattern.confidence + '%)</span>';

    // Show loading
    document.getElementById('chartPlaceholder').classList.add('hidden');
    document.getElementById('chartError').classList.add('hidden');
    document.getElementById('chartLoading').classList.remove('hidden');
    document.getElementById('chartLegend').classList.add('hidden');

    // Cancel any pending fetch
    if (this.abortCtrl) this.abortCtrl.abort();
    this.abortCtrl = new AbortController();

    try {
      const data = await this.fetchCandles(stock.symbol, pattern.timeframe, this.abortCtrl.signal);
      if (!data || !data.candles || !data.candles.length) throw new Error('No candle data returned');

      this.drawChart(data, pattern);
      this.updateInfoCard(stock, pattern);

      document.getElementById('chartLoading').classList.add('hidden');
      document.getElementById('chartLegend').classList.remove('hidden');
    } catch (e) {
      if (e.name === 'AbortError') return; // user switched stock
      console.error('Chart load error:', e);
      document.getElementById('chartLoading').classList.add('hidden');
      document.getElementById('chartErrorText').textContent = 'Failed to load chart: ' + e.message;
      document.getElementById('chartError').classList.remove('hidden');
    }
  },

  async fetchCandles(symbol, timeframe, signal) {
    const cacheKey = symbol + ':' + timeframe;
    if (DataStore.candleCache.has(cacheKey)) return DataStore.candleCache.get(cacheKey);

    const params = TF_PARAMS[timeframe] || TF_PARAMS.daily;
    const url = '/api/yahoo/chart/' + encodeURIComponent(symbol) + '?range=' + params.range + '&interval=' + params.interval;
    const resp = await fetch(url, { signal });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    const result = data.chart && data.chart.result && data.chart.result[0];
    if (!result || !result.timestamp) throw new Error('No chart data');

    const parsed = this.parseCandles(result, params.interval);
    DataStore.candleCache.set(cacheKey, parsed);
    return parsed;
  },

  parseCandles(result, interval) {
    const ts = result.timestamp;
    const q = result.indicators && result.indicators.quote && result.indicators.quote[0];
    if (!ts || !q) return { candles: [], volumes: [] };

    const intraday = ['1m','5m','15m','60m'].includes(interval);
    const candles = [];
    const volumes = [];

    for (let i = 0; i < ts.length; i++) {
      if (q.open && q.close && q.high && q.low &&
          q.open[i] != null && q.close[i] != null && q.high[i] != null && q.low[i] != null) {
        const time = intraday ? ts[i] + IST_OFFSET : ts[i];
        candles.push({ time: time, open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i] });
        volumes.push({
          time: time,
          value: (q.volume && q.volume[i]) || 0,
          color: q.close[i] >= q.open[i] ? 'rgba(38,166,154,0.4)' : 'rgba(239,83,80,0.4)',
        });
      }
    }
    return { candles: candles, volumes: volumes };
  },

  drawChart(data, pattern) {
    const { candles, volumes } = data;

    // Set candle + volume data
    this.candleSeries.setData(candles);
    this.volumeSeries.setData(volumes);

    // Remove old trendlines
    if (this.resLine) { try { this.chart.removeSeries(this.resLine); } catch(e){} this.resLine = null; }
    if (this.supLine) { try { this.chart.removeSeries(this.supLine); } catch(e){} this.supLine = null; }

    // Draw trendlines from pattern anchors
    if (pattern.details && pattern.details.resistance && pattern.details.support) {
      this.drawTrendlines(candles, pattern);
    }

    // Fit content with some right margin
    this.chart.timeScale().fitContent();
  },

  drawTrendlines(candles, pattern) {
    const N = candles.length;
    const res = pattern.details.resistance;
    const sup = pattern.details.support;
    const winSize = pattern.details.windowCandles || 120;
    const windowStart = Math.max(0, N - winSize);

    // Reconstruct local window indices from anchor prices using slope/intercept.
    // anchor.price = slope * localIdx + intercept  →  localIdx = (anchor.price - intercept) / slope
    // Then map to current candle array: currentIdx = windowStart + localIdx
    function anchorToIdx(anchor, line) {
      if (Math.abs(line.slope) > 1e-10) {
        const localIdx = (anchor.price - line.intercept) / line.slope;
        return Math.max(0, Math.min(N - 1, Math.round(windowStart + localIdx)));
      }
      // Flat slope: use stored index with end-alignment fallback
      return Math.max(0, Math.min(N - 1, Math.round(windowStart + (anchor.index % winSize))));
    }

    const resA1idx = anchorToIdx(res.anchor1, res);
    const resA2idx = anchorToIdx(res.anchor2, res);
    const supA1idx = anchorToIdx(sup.anchor1, sup);
    const supA2idx = anchorToIdx(sup.anchor2, sup);

    // Capture anchors for interactive editing
    TrendlineEditor.captureAnchors(candles, resA1idx, resA2idx, supA1idx, supA2idx, res, sup);

    // Extension: 20 bars beyond the later anchor (using slope for price)
    const resExtIdx = Math.min(resA2idx + 20, N - 1);
    const supExtIdx = Math.min(supA2idx + 20, N - 1);
    const resExtPrice = res.anchor2.price + res.slope * (resExtIdx - resA2idx);
    const supExtPrice = sup.anchor2.price + sup.slope * (supExtIdx - supA2idx);

    // Resistance line (red) — passes through exact anchor prices
    this.resLine = this.chart.addLineSeries({
      color: '#ef5350', lineWidth: 2, lineStyle: 0,
      lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
    });
    const resData = [
      { time: candles[resA1idx].time, value: res.anchor1.price },
      { time: candles[resA2idx].time, value: res.anchor2.price },
    ];
    if (resExtIdx > resA2idx) {
      resData.push({ time: candles[resExtIdx].time, value: resExtPrice });
    }
    this.resLine.setData(resData);

    // Support line (green) — passes through exact anchor prices
    this.supLine = this.chart.addLineSeries({
      color: '#26a69a', lineWidth: 2, lineStyle: 0,
      lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
    });
    const supData = [
      { time: candles[supA1idx].time, value: sup.anchor1.price },
      { time: candles[supA2idx].time, value: sup.anchor2.price },
    ];
    if (supExtIdx > supA2idx) {
      supData.push({ time: candles[supExtIdx].time, value: supExtPrice });
    }
    this.supLine.setData(supData);
  },

  updateInfoCard(stock, pattern) {
    const currency = stock.market === 'nse' ? '₹' : '$';
    const fmt = (v) => v != null ? currency + Number(v).toLocaleString('en-IN', { maximumFractionDigits: 2 }) : '—';
    const label = (PATTERN_LABELS[pattern.pattern] || pattern.pattern);
    const icon = PATTERN_ICONS[pattern.pattern] || '📊';

    document.getElementById('infoPattern').textContent = icon + ' ' + label;

    const dirEl = document.getElementById('infoDirection');
    dirEl.textContent = pattern.direction;
    dirEl.className = 'info-value ' + (pattern.direction === 'bullish' ? 'bullish' : pattern.direction === 'bearish' ? 'bearish' : '');

    document.getElementById('infoConf').textContent = pattern.confidence + '%';
    document.getElementById('infoBreakout').textContent = fmt(pattern.breakoutPrice);

    const targetEl = document.getElementById('infoTarget');
    targetEl.textContent = fmt(pattern.targetPrice);
    targetEl.className = 'info-value bullish';

    const slEl = document.getElementById('infoSL');
    slEl.textContent = fmt(pattern.stopLoss);
    slEl.className = 'info-value bearish';

    const d = pattern.details || {};
    document.getElementById('infoTouches').textContent =
      (d.resistance ? d.resistance.touches : '?') + ' res / ' + (d.support ? d.support.touches : '?') + ' sup';

    const status = d.breakoutStatus ? d.breakoutStatus.replace(/_/g, ' ') : '—';
    const statusEl = document.getElementById('infoStatus');
    statusEl.textContent = status;
    statusEl.className = 'info-value' +
      (['near_breakout','breaking_out'].includes(d.breakoutStatus) ? ' bullish' : d.breakoutStatus === 'far_extended' ? ' bearish' : '');
  }
};

// ═══════════════════════════════════════════════════════════════
// TRENDLINE EDITOR (Interactive anchor dragging)
// ═══════════════════════════════════════════════════════════════

const TrendlineEditor = {
  active: false,
  dragging: null,
  candles: null,

  anchors:         { res1: null, res2: null, sup1: null, sup2: null },
  originalAnchors: { res1: null, res2: null, sup1: null, sup2: null },
  handles:         { res1: null, res2: null, sup1: null, sup2: null },

  editBtn: null,
  resetBtn: null,

  init() {
    this.handles.res1 = document.getElementById('handleRes1');
    this.handles.res2 = document.getElementById('handleRes2');
    this.handles.sup1 = document.getElementById('handleSup1');
    this.handles.sup2 = document.getElementById('handleSup2');
    this.editBtn  = document.getElementById('editTrendlineBtn');
    this.resetBtn = document.getElementById('resetTrendlineBtn');

    this.editBtn.addEventListener('click', () => this.toggle());
    this.resetBtn.addEventListener('click', () => this.reset());

    // Reposition handles on scroll/zoom
    ChartPanel.chart.timeScale().subscribeVisibleTimeRangeChange(() => {
      if (this.active) this.repositionHandles();
    });

    this.setupDragHandlers();
  },

  toggle() {
    if (!ChartPanel.resLine || !ChartPanel.supLine) return;
    this.active = !this.active;
    this.editBtn.classList.toggle('active', this.active);

    if (this.active) {
      ChartPanel.chart.applyOptions({ handleScroll: false, handleScale: false });
      Object.values(this.handles).forEach(h => h.classList.add('visible'));
      this.resetBtn.classList.add('visible');
      this.repositionHandles();
    } else {
      ChartPanel.chart.applyOptions({ handleScroll: true, handleScale: true });
      Object.values(this.handles).forEach(h => h.classList.remove('visible'));
      this.resetBtn.classList.remove('visible');
      this.dragging = null;
    }
  },

  captureAnchors(candles, resA1idx, resA2idx, supA1idx, supA2idx, res, sup) {
    this.candles = candles;
    const mk = (idx, price) => ({ candleIndex: idx, time: candles[idx].time, price: price });

    this.anchors.res1 = mk(resA1idx, res.anchor1.price);
    this.anchors.res2 = mk(resA2idx, res.anchor2.price);
    this.anchors.sup1 = mk(supA1idx, sup.anchor1.price);
    this.anchors.sup2 = mk(supA2idx, sup.anchor2.price);

    this.originalAnchors = JSON.parse(JSON.stringify(this.anchors));

    if (this.active) this.repositionHandles();
  },

  repositionHandles() {
    const ts = ChartPanel.chart.timeScale();
    const ps = ChartPanel.candleSeries;

    for (const key of ['res1', 'res2', 'sup1', 'sup2']) {
      const anchor = this.anchors[key];
      const handle = this.handles[key];
      if (!anchor) { handle.style.display = 'none'; continue; }

      const x = ts.timeToCoordinate(anchor.time);
      const y = ps.priceToCoordinate(anchor.price);

      if (x === null || y === null || x < 0 || y < 0) {
        handle.style.opacity = '0';
        handle.style.pointerEvents = 'none';
      } else {
        handle.style.left = x + 'px';
        handle.style.top  = y + 'px';
        handle.style.opacity = '';
        handle.style.pointerEvents = '';
      }
    }
  },

  setupDragHandlers() {
    const container = document.getElementById('chartContainer');

    for (const key of ['res1', 'res2', 'sup1', 'sup2']) {
      this.handles[key].addEventListener('mousedown', (e) => {
        if (!this.active) return;
        e.preventDefault();
        e.stopPropagation();
        this.dragging = key;
        this.handles[key].classList.add('dragging');
      });
    }

    document.addEventListener('mousemove', (e) => {
      if (!this.dragging) return;
      e.preventDefault();
      this.onDrag(e);
    });

    document.addEventListener('mouseup', () => {
      if (!this.dragging) return;
      this.handles[this.dragging].classList.remove('dragging');
      this.dragging = null;
    });
  },

  onDrag(e) {
    const container = document.getElementById('chartContainer');
    const rect = container.getBoundingClientRect();
    const localX = e.clientX - rect.left;
    const localY = e.clientY - rect.top;

    const ts = ChartPanel.chart.timeScale();
    const ps = ChartPanel.candleSeries;

    const time  = ts.coordinateToTime(localX);
    const price = ps.coordinateToPrice(localY);
    if (time == null || price == null) return;

    const candles = this.candles;
    let nearestIdx = this.findNearestCandleByTime(candles, time);
    if (nearestIdx < 0) return;

    // Enforce anchor ordering: anchor1 must be before anchor2
    const key = this.dragging;
    const isA1 = key.endsWith('1');
    const pairedKey = isA1 ? key.replace('1', '2') : key.replace('2', '1');
    const paired = this.anchors[pairedKey];
    if (paired) {
      if (isA1 && nearestIdx >= paired.candleIndex) {
        nearestIdx = paired.candleIndex - 1;
      } else if (!isA1 && nearestIdx <= this.anchors[key.replace('2', '1')].candleIndex) {
        nearestIdx = this.anchors[key.replace('2', '1')].candleIndex + 1;
      }
    }
    nearestIdx = Math.max(0, Math.min(candles.length - 1, nearestIdx));

    const snappedPrice = this.snapPrice(candles[nearestIdx], price);

    this.anchors[key] = {
      candleIndex: nearestIdx,
      time: candles[nearestIdx].time,
      price: snappedPrice,
    };

    this.redrawTrendline(key.startsWith('res') ? 'res' : 'sup');
    this.repositionHandles();
  },

  findNearestCandleByTime(candles, time) {
    let lo = 0, hi = candles.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (candles[mid].time < time) lo = mid + 1;
      else hi = mid;
    }
    if (lo > 0 && Math.abs(candles[lo - 1].time - time) < Math.abs(candles[lo].time - time)) {
      return lo - 1;
    }
    return lo;
  },

  snapPrice(candle, rawPrice) {
    const range = candle.high - candle.low;
    const threshold = range * 0.3;
    if (Math.abs(rawPrice - candle.high) < threshold) return candle.high;
    if (Math.abs(rawPrice - candle.low)  < threshold) return candle.low;
    return rawPrice;
  },

  redrawTrendline(lineType) {
    const a1 = this.anchors[lineType + '1'];
    const a2 = this.anchors[lineType + '2'];
    const candles = this.candles;
    const N = candles.length;
    const series = lineType === 'res' ? ChartPanel.resLine : ChartPanel.supLine;
    if (!series || !a1 || !a2) return;

    const data = [
      { time: a1.time, value: a1.price },
      { time: a2.time, value: a2.price },
    ];

    // Extension: +20 bars beyond anchor2
    const barSpan = a2.candleIndex - a1.candleIndex;
    if (barSpan > 0) {
      const slope = (a2.price - a1.price) / barSpan;
      const extIdx = Math.min(a2.candleIndex + 20, N - 1);
      if (extIdx > a2.candleIndex) {
        data.push({ time: candles[extIdx].time, value: a2.price + slope * (extIdx - a2.candleIndex) });
      }
    }

    series.setData(data);
  },

  reset() {
    if (!this.originalAnchors.res1) return;
    this.anchors = JSON.parse(JSON.stringify(this.originalAnchors));
    this.redrawTrendline('res');
    this.redrawTrendline('sup');
    this.repositionHandles();
  },

  deactivate() {
    if (this.active) this.toggle();
    this.anchors         = { res1: null, res2: null, sup1: null, sup2: null };
    this.originalAnchors = { res1: null, res2: null, sup1: null, sup2: null };
    this.candles = null;
    this.dragging = null;
  },
};

// ═══════════════════════════════════════════════════════════════
// APP (Orchestration)
// ═══════════════════════════════════════════════════════════════

const App = {
  async init() {
    // Load data
    await DataStore.load();

    // Init components
    StockList.init();
    ChartPanel.init();
    TrendlineEditor.init();

    // Render stock list
    StockList.render();

    // Deep-link from hash
    const hash = window.location.hash.slice(1);
    if (hash) {
      const decoded = decodeURIComponent(hash);
      const idx = DataStore.filteredStocks.findIndex(s => s.symbol === decoded || s.symbol.replace('.NS','') === decoded);
      if (idx >= 0) DataStore.selectedIndex = idx;
    }

    // Load first stock
    if (DataStore.filteredStocks.length > 0) {
      StockList.highlight();
      ChartPanel.loadStock(DataStore.getSelectedStock());
      this.updateHash();
    }

    // Setup filters
    this.setupFilters();

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowDown' || e.key === 'j') {
        e.preventDefault();
        this.selectNext();
      } else if (e.key === 'ArrowUp' || e.key === 'k') {
        e.preventDefault();
        this.selectPrev();
      } else if (e.key === 'e' || e.key === 'E') {
        e.preventDefault();
        TrendlineEditor.toggle();
      }
    });
  },

  setupFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const filterType = btn.dataset.filter;
        const value = btn.dataset.value;

        // Toggle active state within group
        btn.closest('.filter-row').querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        DataStore.filters[filterType] = value;
        DataStore.applyFilters();
        StockList.render();

        // Load first stock after filter change
        if (DataStore.filteredStocks.length > 0) {
          DataStore.selectedIndex = 0;
          StockList.highlight();
          ChartPanel.loadStock(DataStore.getSelectedStock());
          this.updateHash();
        }
      });
    });

    // Search
    const searchInput = document.getElementById('searchInput');
    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        DataStore.filters.search = searchInput.value.trim();
        DataStore.applyFilters();
        StockList.render();
        if (DataStore.filteredStocks.length > 0) {
          DataStore.selectedIndex = 0;
          StockList.highlight();
          ChartPanel.loadStock(DataStore.getSelectedStock());
          this.updateHash();
        }
      }, 250);
    });
  },

  selectNext() {
    if (DataStore.selectedIndex < DataStore.filteredStocks.length - 1) {
      DataStore.selectedIndex++;
      StockList.highlight();
      ChartPanel.loadStock(DataStore.getSelectedStock());
      this.updateHash();
    }
  },

  selectPrev() {
    if (DataStore.selectedIndex > 0) {
      DataStore.selectedIndex--;
      StockList.highlight();
      ChartPanel.loadStock(DataStore.getSelectedStock());
      this.updateHash();
    }
  },

  updateHash() {
    const stock = DataStore.getSelectedStock();
    if (stock) {
      const sym = stock.symbol.replace('.NS', '');
      history.replaceState(null, '', '#' + encodeURIComponent(sym));
    }
  }
};

// ── Boot ──
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
